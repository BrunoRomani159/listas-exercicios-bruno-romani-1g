<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etapa 8 - Calculadora de média</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Calculadora de média</h1>

    <label for="nota1">Primeira nota:</label>
    <input type="number" id="nota1" min="0" max="10" step="0.1">

    <br><br>

    <label for="nota2">Segunda nota:</label>
    <input type="number" id="nota2" min="0" max="10" step="0.1">

    <br><br>

    <button id="botaoCalcular">Calcular média</button>

    <p id="resultado">Digite as duas notas para começar.</p>
</body>
</html>
